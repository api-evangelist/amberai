openapi: 3.2.0
info:
  title: Amber Public Parent Products API
  version: 1.3.0
  description: Read your brand's catalog, sourcing, orders, shipments, finance, and documents. All business endpoints are read-only and require an API key. Products are Parent Products; Product Options and SKUs are separate resources. Use filters to find records, follow their IDs to related data, and paginate to retrieve every result. See the integration tutorials for complete examples and data conventions for amounts, IDs, and timestamps.
servers:
- url: https://app.amber.ai/api/public/v1
tags:
- name: Parent Products
paths:
  /brands/{brand}/products:
    get:
      tags:
      - Parent Products
      summary: List Parent Products
      operationId: listProducts
      security:
      - ApiKeyAuth: []
      parameters:
      - name: brand
        in: path
        required: true
        description: Brand slug authorized by this API key.
        schema:
          type: string
          example: acme
      - name: cursor
        in: query
        required: false
        description: Opaque nextCursor from the same collection and filters. Omit on the first request.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: code
        in: query
        required: false
        description: 'Exact, case-sensitive Parent Product code. Example: TEE-001.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Exact, case-sensitive Parent Product code. Example: TEE-001.'
          examples:
          - TEE-001
      - name: status
        in: query
        required: false
        description: Exact product workflow status.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact product workflow status.
      - name: categoryId
        in: query
        required: false
        description: Category ID from /categories.
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Category ID from /categories.
      - name: q
        in: query
        required: false
        description: Case-insensitive literal substring of product name or code. Percent and underscore are ordinary characters.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: Case-insensitive literal substring of product name or code. Percent and underscore are ordinary characters.
          examples:
          - cotton
      responses:
        '200':
          description: A page of matching records. totalItems counts all matches across pages. When nextCursor is null, you have reached the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000001
                  code: TEE-001
                  name: Cotton tee
                  status: active
                  category: Apparel
                  createdAt: '2026-01-15T10:00:00.000Z'
                  updatedAt: '2026-09-30T08:00:00.000Z'
                nextCursor: null
                totalItems: 1
          headers:
            Link:
              description: Origin-relative URL for the next page, with rel="next". Resolve against this response URL. Preserves filters and page size; omitted when nextCursor is null.
              schema:
                type: string
        '400':
          description: Invalid parameter, unsupported include, or cursor used with different filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, expired, or out-of-scope API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The record was not found or is not available to your brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded. Retry after the indicated delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds before retrying.
              schema:
                type: integer
                minimum: 0
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /brands/{brand}/products/{id}:
    get:
      tags:
      - Parent Products
      summary: Get Parent Products
      operationId: getProducts
      security:
      - ApiKeyAuth: []
      parameters:
      - name: brand
        in: path
        required: true
        description: Brand slug authorized by this API key.
        schema:
          type: string
          example: acme
      - name: id
        in: path
        required: true
        description: Stable resource identifier.
        schema:
          type: string
      - name: include
        in: query
        required: false
        description: 'Related collections to include, separated by commas: documents, images, bomSections, launchWindowDefinitions, tagDefinitions, collectionDefinitions, dimensionValueDefinitions, dimensionDefinitions, optionValueDefinitions, optionDefinitions, categories, colors, materialVariants, materials, productOptions, skus, versions, boms, bomComponents, measurementTables, optionValues, dimensionValues, prices, optionCollections, bomSkus, measurementTableSkus, skuDimensionValues, collections, tags, launchWindows, relations. Use all to request every supported collection. Each collection returns up to includeLimit records (default 25, maximum 100). To read more, add its nextCursor to the returned url. Each distinct collection uses one expansion credit. Your key has up to 62 credits, replenished at 1,000 per hour by default. On 429, wait for Retry-After before retrying. Continuation requests use no expansion credits. See [product expansions](https://docs.amber.ai/product-graphs) for examples and rate limits.'
        schema:
          type: string
          example: boms,bomComponents,measurementTables,productOptions,materials
      - name: includeLimit
        in: query
        required: false
        description: Rows per included relationship, default 25. Requires include. Each relationship has its own continuation cursor.
        schema:
          description: Rows per included relationship, default 25. Requires include. Each relationship has its own continuation cursor.
          default: 25
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          description: Invalid parameter, unsupported include, or cursor used with different filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, expired, or out-of-scope API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The record was not found or is not available to your brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded. Retry after the indicated delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds before retrying.
              schema:
                type: integer
                minimum: 0
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
